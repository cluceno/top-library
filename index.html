<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <h1>Library</h1>

    <table>
        <thead>
            <tr>
                <th>Title</th>
                <th>Author</th>
                <th>ISBN</th>
                <th>Status(read/unread)</th>
                <th>Add/Remove</th>
            </tr>
        </thead>
        <tbody class="library">
        </tbody>
    </table>

    <form>
        <fieldset>
            <legend>Add A Book to Your Library</legend>
            
            <label for="title">Title:</label>
            <input type="text" id="title" name="title">

            <label for="author">Author:</label>
            <input type="text" id="author" name="author">

            <label for="isbn">ISBN:</label>
            <input type="text" id="isbn" name="isbn">


            <label for="read">Read</label>
            <input type="radio" id="read" name="status" value="read">
                
            <label for="unread">Unread</label>
            <input type="radio" id="unread" name="status" value="unread">


            <button type="button" class="addBook">Submit</button>

        </fieldset>

        


    </form>

</body>
</html>
